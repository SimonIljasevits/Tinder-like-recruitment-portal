<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sobib — tööäpi prototüüp</title>
<meta name="description" content="Klikitav prototüüp: Tinder-stiilis töövahendus, kus näidatakse ainult 100% sobivaid tööpakkumisi.">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Baasreset. Ülejäänu on css/styles.css */
  :root{
    color-scheme:light;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<link rel="stylesheet" href="css/styles.css?v=2">
</head>
<body>
<div class="shell web" id="shell">
<div class="app">

  <header class="top">
    <span class="brand"><span class="mark">S</span><b>Sobib</b></span>
    <span class="demo-chip" id="demochip">Prototüüp</span>
    <span class="viewtog" role="group" aria-label="Vaade / View">
      <button type="button" id="viewWeb" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M9 20h6M12 17v3"/></svg>
      </button>
      <button type="button" id="viewPhone" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.8 18.6h2.4"/></svg>
      </button>
    </span>
    <a href="crawler.html" title="AI Kuulutuste Importija" style="color:var(--ink-2);text-decoration:none;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
      <span>AI Import</span>
    </a>
    <span class="lang" role="group" aria-label="Keel / Language">
      <button type="button" id="langEt" aria-pressed="true">ET</button>
      <button type="button" id="langEn" aria-pressed="false">EN</button>
    </span>
  </header>

  <!-- TÖÖD -->
  <section class="view" id="viewJobs">
    <div class="filterbar">
      <span class="count" id="fCount"></span>
      <span class="why" id="fWhy"></span>
      <div style="display:inline-flex;gap:8px;align-items:center;">
        <button type="button" class="linkbtn" id="btnRefreshJobs" title="Värskenda andmebaasist" style="cursor:pointer;">🔄 Värskenda</button>
        <button type="button" class="linkbtn" id="btnFilters"></button>
      </div>
    </div>
    <div class="jobsrow">
    <div class="cardcol">
    <div class="stack" id="stack" tabindex="0" role="group"></div>
    <div class="actions">
      <span class="actwrap">
        <button type="button" class="act sm undo" id="btnUndo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h11a5 5 0 010 10h-5"/><path d="M8 5L4 9l4 4"/></svg>
        </button>
        <span class="actlabel" id="labUndo"></span>
      </span>
      <span class="actwrap">
        <button type="button" class="act lg no" id="btnPass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <span class="actlabel" id="labPass"></span>
      </span>
      <span class="actwrap">
        <button type="button" class="act sm save" id="btnSave">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 4h12v16l-6-4-6 4z"/></svg>
        </button>
        <span class="actlabel" id="labSave"></span>
      </span>
      <span class="actwrap">
        <button type="button" class="act lg yes" id="btnLike">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 6.5"/></svg>
        </button>
        <span class="actlabel" id="labLike"></span>
      </span>
    </div>
    <p class="hint" id="hint"></p>
    </div>
    <aside class="deskpane" id="deskpane" aria-label="Kuulutus">
      <div class="deskhead"><span class="logo" id="deskIni" aria-hidden="true"></span><h2 id="deskCo"></h2></div>
      <div class="scroll" id="deskBody"></div>
    </aside>
    </div>
  </section>

  <!-- SOBIVUSED -->
  <section class="view" id="viewMatches" hidden>
    <div class="scroll">
      <h2 class="secttitle" id="mTitle"></h2>
      <p class="sectnote" id="mNote"></p>
      <h3 class="secttitle sub" id="aTitle" hidden></h3>
      <ul class="mlist" id="aList"></ul>
      <h3 class="secttitle sub" id="cTitle" hidden></h3>
      <ul class="mlist" id="mList"></ul>
      <h3 class="secttitle sub" id="sTitle" hidden></h3>
      <ul class="mlist" id="sList"></ul>
    </div>
  </section>

  <!-- PROFIIL -->
  <section class="view" id="viewProfile" hidden>
    <div class="scroll">
      <h2 class="secttitle" id="pTitle"></h2>
      <p class="sectnote" id="pNote"></p>
      <div class="statrow">
        <span class="stat"><span class="n" id="pStatA"></span><span class="l" id="pStatAL"></span></span>
        <span class="stat"><span class="n" id="pStatB"></span><span class="l" id="pStatBL"></span></span>
        <span class="stat"><span class="n" id="pStatC"></span><span class="l" id="pStatCL"></span></span>
      </div>
      <div id="pTags"></div>
      <button type="button" class="bigbtn" id="btnSetup"></button>
      <a class="bigbtn ghost rolelink" id="toEmployer" href="tooandja/index.html"></a>
      <button type="button" class="bigbtn ghost" id="btnReset"></button>
    </div>
  </section>

  <nav class="nav" aria-label="Põhimenüü">
    <button type="button" id="navJobs" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 012-2h2a2 2 0 012 2v2"/></svg>
      <span id="navJobsL"></span>
    </button>
    <button type="button" id="navMatches">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.3 7.3L3 21l1.7-6.7A8 8 0 1121 12z"/></svg>
      <span id="navMatchesL"></span>
      <span class="badge" id="navBadge" hidden>0</span>
    </button>
    <button type="button" id="navProfile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>
      <span id="navProfileL"></span>
    </button>
  </nav>

  <!-- SEADISTUS -->
  <div class="sheet" id="setup" hidden role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <div class="sheethead">
      <h2 id="setupTitle"></h2>
      <button type="button" class="iconbtn" id="setupClose" aria-label="Sulge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="steps"><span class="on"></span><span></span><span></span></div>
    <div class="stepintro"><h3 id="stepH"></h3><p id="stepP"></p></div>
    <div class="scroll" id="stepBody"></div>
    <p class="livecount" id="liveCount"></p>
    <div class="sheetfoot">
      <button type="button" class="bigbtn ghost" id="stepBack"></button>
      <button type="button" class="bigbtn" id="stepNext"></button>
    </div>
  </div>

  <!-- KUULUTUS -->
  <div class="sheet" id="detail" hidden role="dialog" aria-modal="true" aria-labelledby="dCo">
    <div class="sheethead">
      <button type="button" class="iconbtn" id="dBack" aria-label="Tagasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="dCo"></h2>
    </div>
    <div class="scroll" id="dBody"></div>
    <div class="sheetfoot">
      <button type="button" class="bigbtn ghost" id="dPass"></button>
      <button type="button" class="bigbtn" id="dLike"></button>
    </div>
  </div>

  <!-- CV TOIMETI -->
  <div class="sheet" id="cvedit" hidden role="dialog" aria-modal="true" aria-labelledby="cvHead">
    <div class="sheethead">
      <button type="button" class="iconbtn" id="cvBack" aria-label="Tagasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="cvHead"></h2>
    </div>
    <div class="scroll" id="cvBody"></div>
    <div class="sheetfoot">
      <button type="button" class="bigbtn ghost" id="cvCancel"></button>
      <button type="button" class="bigbtn" id="cvSend"></button>
    </div>
  </div>

  <!-- SAADETUD CV (ainult vaatamiseks) -->
  <div class="sheet" id="cvview" hidden role="dialog" aria-modal="true" aria-labelledby="cvvHead">
    <div class="sheethead">
      <button type="button" class="iconbtn" id="cvvBack" aria-label="Tagasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="cvvHead"></h2>
    </div>
    <div class="scroll" id="cvvBody"></div>
  </div>

  <!-- VESTLUS -->
  <div class="sheet" id="chat" hidden role="dialog" aria-modal="true" aria-labelledby="chatTitle">
    <div class="sheethead">
      <button type="button" class="iconbtn" id="chatBack" aria-label="Tagasi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="chatTitle"></h2>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="quick" id="quick"></div>
    <form class="composer" id="composer">
      <label class="sr" for="msgInput">Sõnum</label>
      <input id="msgInput" autocomplete="off">
      <button type="submit" aria-label="Saada">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg>
      </button>
    </form>
  </div>

  <!-- MATCH -->
  <div class="matchpop" id="matchpop" hidden role="dialog" aria-modal="true" aria-labelledby="matchBig">
    <p class="big" id="matchBig"></p>
    <span class="co" id="matchCo"></span>
    <p id="matchTxt"></p>
    <span class="btns" id="matchBtns"></span>
  </div>

  <!-- NAME POPUP (Session start) -->
  <div class="matchpop" id="namepop" role="dialog" aria-modal="true" aria-labelledby="namePopTitle">
    <p class="big" id="namePopTitle">Tere tulemast!</p>
    <p id="namePopSubtitle" style="color:#E9F0EE;font-size:15px;max-width:28ch;">Sisesta oma nimi, et alustada tööde sirvimist.</p>
    <form id="nameForm" style="display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;max-width:280px;margin-top:8px;">
      <input type="text" id="nameInput" placeholder="Sinu nimi / Your name" autofocus required style="width:100%;padding:13px 16px;font-size:16px;border-radius:12px;border:1px solid #ccc;background:#fff;color:#111;text-align:center;box-sizing:border-box;outline:none;">
      <button type="submit" class="bigbtn" id="nameSubmit" style="width:100%;">Alusta</button>
    </form>
  </div>

  <label class="sr" for="letterFile">Motivatsioonikiri</label>
  <input type="file" id="letterFile" accept="application/pdf,.pdf" hidden>

  <p class="sr" id="live" aria-live="polite"></p>
</div>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
<style>
/* Layout: üks telefoniekraan — päis, kaardipakk, alumine navigatsioon. Töörõivaste paletis: tume tint + ohutuskollane. */
:root{
  --bg:#E4E8E7;
  --surface:#FFFFFF;
  --surface-2:#F2F5F3;
  --ink:#12191C;
  --ink-2:#56646A;
  --line:#D2D9D7;
  --hivis:#D4E655;
  --on-hivis:#12191C;
  --match:#15795A;
  --pass:#A8432C;
  --focus:#1E6FD9;
  --shadow:0 18px 40px -22px rgba(18,25,28,.45);
  --font-display:"Archivo","Arial Narrow",Helvetica,sans-serif;
  --font-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F11;
    --surface:#161D21;
    --surface-2:#1F282C;
    --ink:#E9F0EE;
    --ink-2:#9AA8AD;
    --line:#2B3539;
    --hivis:#C9DB4B;
    --on-hivis:#12191C;
    --match:#46C194;
    --pass:#E3775C;
    --focus:#79B2FF;
    --shadow:0 18px 40px -22px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F11;
  --surface:#161D21;
  --surface-2:#1F282C;
  --ink:#E9F0EE;
  --ink-2:#9AA8AD;
  --line:#2B3539;
  --hivis:#C9DB4B;
  --on-hivis:#12191C;
  --match:#46C194;
  --pass:#E3775C;
  --focus:#79B2FF;
  --shadow:0 18px 40px -22px rgba(0,0,0,.8);
  color-scheme:dark;
}

html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}

/* ---------- raam ----------
   Kõrgus tuleb otse vaateaknast (svh), mitte vanemelementide ahelast —
   telefonis kukkus height:100% ahel kokku ja kaardipakk kahanes nulli. */
.shell{
  height:100%;
  height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  min-height:420px;
  display:flex;align-items:center;justify-content:center;padding:0;overflow:hidden;
}
.app{
  width:100%;height:100%;min-height:0;
  display:flex;flex-direction:column;
  background:var(--surface);
  position:relative;overflow:hidden;
}
.stack{min-height:240px}
/* kaardipakk ei veni laiaks ekraanil laiali — veerg jääb telefonisõbralikuks */
.jobsrow{flex:1;min-height:0;display:flex;flex-direction:column}
.cardcol{flex:1;min-height:0;width:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column}
.deskpane{display:none}

/* ---------- päis ---------- */
.top{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px 10px;border-bottom:1px solid var(--line);
  flex:0 0 auto;background:var(--surface);
}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.mark{
  width:26px;height:26px;border-radius:7px;background:var(--hivis);color:var(--on-hivis);
  display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:15px;
  flex:0 0 auto;
}
.brand b{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em}
.demo-chip{
  font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:3px 7px;white-space:nowrap;
}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
.lang button{
  background:none;border:0;padding:4px 9px;cursor:pointer;
  font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--ink-2);
}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* ---------- vaated ---------- */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none}

/* ---------- kaardipakk ---------- */
.filterbar{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-bottom:1px solid var(--line);flex:0 0 auto;background:var(--surface-2);
}
.filterbar .count{font-family:var(--font-mono);font-size:12px;font-weight:600;white-space:nowrap;margin-right:auto}
@media (max-width:430px){ .filterbar .why{display:none} }
.filterbar .count b{color:var(--match)}
.filterbar .why{color:var(--ink-2);font-size:12px;margin-right:auto}
.linkbtn{
  background:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;
  font-size:12px;font-weight:600;white-space:nowrap;
}
.linkbtn:hover{background:var(--surface)}

/* touch-action:none — vertikaalne swipe peab jõudma meieni, mitte brauseri kerimisse */
.stack{position:relative;flex:1;min-height:0;padding:14px 16px;touch-action:none}
.card{
  position:absolute;inset:14px 16px;
  background:var(--surface);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  overflow:hidden;
  will-change:transform;
  cursor:grab;
}
.card.drag{cursor:grabbing;transition:none}
.card.anim{transition:transform .32s cubic-bezier(.22,.61,.36,1),opacity .32s}

/* fotoala: pilt täidab kaardi, info istub gradiendi peal — Tinderi paigutus */
.photo{
  position:relative;flex:1;min-height:0;
  display:flex;flex-direction:column;justify-content:flex-end;
  color:#fff;overflow:hidden;
}
.glyph{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:min(27vh,160px);line-height:1;
  color:rgba(255,255,255,.08);user-select:none;
}
.segs{position:absolute;top:9px;left:10px;right:10px;display:flex;gap:4px;z-index:3}
.segs span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.32)}
.segs span.on{background:#fff}
.pill{
  position:absolute;top:20px;z-index:3;border-radius:999px;padding:4px 9px;
  font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.04em;
}
.pill.km{left:12px;background:rgba(8,10,12,.55);color:#fff}
.pill.fitp{right:12px;background:var(--match);color:#fff}
.pill.source-pill{
  top:48px;left:12px;
  font-size:10px;font-weight:700;
  display:inline-flex;align-items:center;gap:4px;
  box-shadow:0 2px 8px rgba(0,0,0,0.35);
}
.pill.source-pill.cvkeskus{
  background:linear-gradient(135deg, #F59E0B, #D97706);
  color:#1C1000;
  border:1px solid rgba(255,255,255,0.45);
}
.pill.source-pill.tootukassa{
  background:linear-gradient(135deg, #0284C7, #0369A1);
  color:#FFFFFF;
  border:1px solid rgba(255,255,255,0.45);
}
.pill.source-pill.internal{
  background:linear-gradient(135deg, #10B981, #059669);
  color:#FFFFFF;
  border:1px solid rgba(255,255,255,0.3);
}

.pill.redirect-pill{
  top:48px;right:12px;
  font-size:10.5px;font-weight:700;
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(12,16,20,0.75);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.35);
  color:#FFFFFF;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
  transition:all .15s ease;
}
.pill.redirect-pill:hover{
  background:rgba(255,255,255,0.22);
  transform:scale(1.04);
}

.dext-btn{
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.35);
  color:#FFFFFF;
  padding:5px 12px;
  border-radius:6px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s;
}
.dext-btn:hover{
  background:rgba(255,255,255,0.28);
}

.src-tag{
  display:inline-block;padding:1px 6px;border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;
}
.src-tag.ext{
  background:rgba(245,158,11,0.25);color:#FBBF24;border:1px solid rgba(245,158,11,0.5);
}
.src-tag.tootukassa{
  background:rgba(2,132,199,0.25);color:#38BDF8;border:1px solid rgba(2,132,199,0.5);
}
.src-tag.int{
  background:rgba(16,185,129,0.25);color:#34D399;border:1px solid rgba(16,185,129,0.4);
}

.dsource{
  margin-top:10px;padding:10px 14px;border-radius:10px;display:flex;align-items:center;gap:10px;font-size:13px;
}
.dsource.ext{
  background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.35);color:#F59E0B;
}
.dsource.ext strong{color:#FBBF24;}
.dsource.ext span{display:block;font-size:11.5px;color:rgba(255,255,255,0.7);}
.dsource.tootukassa{
  background:rgba(2,132,199,0.12);border:1px solid rgba(2,132,199,0.35);color:#0284C7;
}
.dsource.tootukassa strong{color:#38BDF8;}
.dsource.tootukassa span{display:block;font-size:11.5px;color:rgba(255,255,255,0.7);}
.dsource.int{
  background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.35);color:#10B981;
}
.dsource.int strong{color:#34D399;}
.dsource.int span{display:block;font-size:11.5px;color:rgba(255,255,255,0.7);}
.phmark{
  position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);z-index:2;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.55);border:1px dashed rgba(255,255,255,.32);
  border-radius:6px;padding:5px 9px;white-space:nowrap;
}
.scrim{
  position:relative;z-index:2;padding:34px 15px 15px;
  background:linear-gradient(to top,rgba(8,10,12,.95),rgba(8,10,12,.74) 42%,rgba(8,10,12,0));
  display:flex;flex-direction:column;gap:5px;
}
.crole{
  margin:0;font-family:var(--font-display);font-weight:800;
  font-size:clamp(22px,6.6vw,28px);line-height:1.08;letter-spacing:-.02em;
  text-wrap:balance;color:#fff;padding-right:40px;
}
.csub{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:13.5px;color:rgba(255,255,255,.82)}
.cpay{font-family:var(--font-display);font-weight:800;font-size:19px;color:var(--hivis)}
.infobtn{
  position:absolute;right:13px;bottom:15px;z-index:4;
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.8);background:rgba(8,10,12,.3);color:#fff;
  display:grid;place-items:center;cursor:pointer;
  font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1;
}
.under{flex:0 0 auto;padding:10px 13px 12px;background:var(--surface)}
.card-top{display:flex;align-items:center;gap:10px}
.logo{
  width:38px;height:38px;border-radius:10px;flex:0 0 auto;
  background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;
  font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--ink-2);
}
.who{min-width:0;display:flex;flex-direction:column}
.co{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
.fit{
  margin-left:auto;flex:0 0 auto;
  background:var(--match);color:#fff;border-radius:999px;padding:4px 9px;
  font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.04em;
}
.group{display:flex;flex-direction:column;gap:6px;min-width:0}
.glabel{
  margin:0;font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);
}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
  padding:5px 9px;font-size:12.5px;line-height:1.25;
}
.chips.accom li{border-color:color-mix(in srgb,var(--match) 35%,var(--line));background:color-mix(in srgb,var(--match) 8%,var(--surface))}
.chips li.plus{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}
.under .chips li{font-size:12px;padding:4px 8px}

/* kuulutuse täisvaade */
.dhero{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.dhero h3{
  margin:0;flex:1;min-width:0;font-family:var(--font-display);font-weight:800;
  font-size:22px;line-height:1.12;letter-spacing:-.015em;text-wrap:balance;
}
.dsect{margin-bottom:18px}
.dsect .glabel{margin:0 0 7px}
.dsect p{margin:0 0 9px;font-size:14.5px;max-width:62ch}
.dsect p:last-child{margin-bottom:0}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.facts dt{font-size:12px;color:var(--ink-2);white-space:nowrap}
.facts dd{margin:0;font-size:14px;min-width:0}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.checks li{display:flex;align-items:flex-start;gap:8px;font-size:14px}
.checks svg{width:16px;height:16px;flex:0 0 auto;margin-top:3px;color:var(--match)}
.bullets{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.bullets li{font-size:14px}
.dnote{
  margin:0;padding-top:12px;border-top:1px dashed var(--line);
  font-size:12px;color:var(--ink-2);
}
#detail .sheetfoot .bigbtn{flex:1}
.stamp{
  position:absolute;top:52px;z-index:6;
  font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:.06em;text-transform:uppercase;
  border:3.5px solid;border-radius:9px;padding:6px 12px;opacity:0;pointer-events:none;
  background:rgba(8,10,12,.25);
}
.stamp.like{right:18px;color:#8FE84B;border-color:#8FE84B;transform:rotate(11deg)}
.stamp.pass{left:18px;color:#FF6B4A;border-color:#FF6B4A;transform:rotate(-11deg)}
.stamp.keep{top:auto;bottom:38%;left:50%;color:#79B8FF;border-color:#79B8FF;transform:translateX(-50%) rotate(-3deg)}

.empty{
  position:absolute;inset:14px 16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;gap:12px;
  border:1px dashed var(--line);border-radius:var(--r);padding:24px;
}
.empty h2{margin:0;font-family:var(--font-display);font-size:20px}
.empty p{margin:0;color:var(--ink-2);font-size:13.5px;max-width:30ch}

/* ---------- tegevusnupud ---------- */
.actions{
  display:flex;align-items:center;justify-content:center;gap:clamp(9px,4vw,18px);
  padding:10px 14px 12px;flex:0 0 auto;
}
.act{
  border-radius:50%;cursor:pointer;display:grid;place-items:center;
  border:2px solid;background:var(--surface);
  transition:transform .12s ease;
  box-shadow:0 4px 12px -6px rgba(18,25,28,.4);
}
.act:active{transform:scale(.9)}
.act.sm{width:46px;height:46px}
.act.sm svg{width:20px;height:20px}
.act.lg{width:62px;height:62px}
.act.lg svg{width:27px;height:27px}
.act.undo{border-color:#C9922A;color:#C9922A}
.act.no{border-color:var(--pass);color:var(--pass)}
.act.save{border-color:#2E7BD6;color:#2E7BD6}
.act.yes{border-color:var(--hivis);background:var(--hivis);color:var(--on-hivis)}
.act[disabled]{opacity:.3;cursor:default;box-shadow:none}
.actlabel{
  text-align:center;font-size:10px;color:var(--ink-2);font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;margin-top:5px;
}
.actwrap{display:flex;flex-direction:column;align-items:center}
@media (max-height:720px){ .actlabel{display:none} .actions{padding-bottom:10px} }
@media (max-height:660px){ .hint{display:none} .act.lg{width:54px;height:54px} .act.sm{width:42px;height:42px} }
.hint{text-align:center;font-size:11.5px;color:var(--ink-2);padding:0 16px 10px}

/* ---------- alumine nav ---------- */
.nav{
  display:flex;flex:0 0 auto;border-top:1px solid var(--line);background:var(--surface);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav button{
  flex:1;background:none;border:0;cursor:pointer;padding:9px 4px 11px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11px;font-weight:600;color:var(--ink-2);position:relative;
}
.nav button svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"]::after{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:30px;height:3px;background:var(--hivis);border-radius:0 0 3px 3px;
}
.badge{
  position:absolute;top:5px;right:calc(50% - 22px);
  min-width:17px;height:17px;border-radius:999px;background:var(--match);color:#fff;
  font-family:var(--font-mono);font-size:10px;font-weight:600;
  display:grid;place-items:center;padding:0 4px;
}
.badge[hidden]{display:none}

/* ---------- loendid ---------- */
.scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px}
.secttitle.sub{font-size:16px;margin-top:22px}
.secttitle{
  margin:0 0 10px;font-family:var(--font-display);font-size:19px;font-weight:700;letter-spacing:-.01em;
}
.sectnote{margin:0 0 14px;color:var(--ink-2);font-size:13px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.mrow{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:11px;cursor:pointer;
}
.mrow:hover{background:var(--surface-2)}
.mrow .who{flex:1}
.mrow .co{font-size:14.5px}
.mrow .prev{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .dot{width:8px;height:8px;border-radius:50%;background:var(--match);flex:0 0 auto}

/* ---------- profiil ---------- */
.pgroup{margin-bottom:18px}
.pgroup h3{
  margin:0 0 8px;font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);
}
.statrow{
  display:flex;gap:9px;margin-bottom:18px;
}
.stat{
  flex:1;border:1px solid var(--line);border-radius:var(--r);padding:11px;background:var(--surface-2);
}
.stat .n{font-family:var(--font-mono);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;display:block}
.stat .l{font-size:11.5px;color:var(--ink-2);line-height:1.3;display:block;margin-top:2px}
.bigbtn{
  width:100%;background:var(--hivis);color:var(--on-hivis);border:0;border-radius:11px;
  padding:14px;font-weight:600;font-size:15px;cursor:pointer;
}
.bigbtn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.bigbtn+.bigbtn{margin-top:9px}

/* ---------- ülekatted ---------- */
.sheet{
  position:absolute;inset:0;z-index:30;background:var(--surface);
  display:flex;flex-direction:column;
}
.sheet[hidden]{display:none}
.sheethead{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;
}
.sheethead h2{margin:0;font-family:var(--font-display);font-size:17px;font-weight:700;flex:1;min-width:0}
.iconbtn{
  background:none;border:1px solid var(--line);border-radius:9px;width:34px;height:34px;
  display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
}
.iconbtn svg{width:18px;height:18px}

/* seadistus */
.steps{display:flex;gap:5px;padding:12px 16px 0}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--hivis)}
.stepintro{padding:12px 16px 0}
.stepintro h3{margin:0 0 4px;font-family:var(--font-display);font-size:20px;font-weight:700}
.stepintro p{margin:0;color:var(--ink-2);font-size:13px}
.taggrid{display:flex;flex-wrap:wrap;gap:8px}
.tag{
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;font-size:13.5px;cursor:pointer;
}
.tag[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.payrow{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.payrow .v{font-family:var(--font-mono);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums}
.payrow .u{font-family:var(--font-mono);font-size:13px;color:var(--ink-2)}
input[type=range]{width:100%;accent-color:var(--match)}
.sheetfoot{
  display:flex;gap:9px;padding:12px 16px;border-top:1px solid var(--line);flex:0 0 auto;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
}
.sheetfoot .bigbtn{margin-top:0}
.livecount{
  font-family:var(--font-mono);font-size:12px;color:var(--ink-2);padding:0 16px 10px;
}
.livecount b{color:var(--match)}

/* match-ülekate */
.matchpop{
  position:absolute;inset:0;z-index:40;background:color-mix(in srgb,var(--ink) 82%,transparent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;
}
.matchpop[hidden]{display:none}
.matchpop .big{
  font-family:var(--font-display);font-weight:800;font-size:clamp(34px,11vw,46px);
  color:var(--hivis);letter-spacing:-.02em;line-height:1;margin:0;
}
.matchpop p{margin:0;color:#E9F0EE;font-size:14.5px;max-width:28ch}
.matchpop .co{color:#fff;font-weight:600;font-size:17px}
.matchpop .btns{display:flex;flex-direction:column;gap:9px;width:100%;max-width:280px;margin-top:6px}
.matchpop .bigbtn.ghost{color:#E9F0EE;border-color:#E9F0EE59}

/* vestlus */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:9px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4}
.msg.them{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--ink);color:var(--surface);border-bottom-right-radius:4px;align-self:flex-end}
.msg .time{display:block;font-family:var(--font-mono);font-size:10px;opacity:.6;margin-top:3px}
.sysmsg{
  align-self:center;text-align:center;font-size:11.5px;color:var(--ink-2);
  background:var(--surface-2);border-radius:999px;padding:5px 12px;
}
.quick{display:flex;gap:7px;overflow-x:auto;padding:0 14px 10px}
.quick button{
  white-space:nowrap;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:7px 12px;font-size:13px;cursor:pointer;
}
.composer{
  display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex:0 0 auto;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
}
.composer input{
  flex:1;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;
  padding:11px 15px;font:inherit;font-size:14px;color:var(--ink);
}
.composer button{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;background:var(--hivis);color:var(--on-hivis);
  display:grid;place-items:center;cursor:pointer;
}
.composer button svg{width:19px;height:19px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- kandideerimised ja CV ---------- */
.emptyrow{
  list-style:none;color:var(--ink-2);font-size:13px;line-height:1.5;
  border:1px dashed var(--line);border-radius:var(--r);padding:14px;
}
.appcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.mrow.flat{border:0;border-radius:0;background:none;cursor:default;padding:11px}
.mrow.flat:hover{background:none}
.status{
  flex:0 0 auto;border-radius:999px;padding:4px 9px;
  font-family:var(--font-mono);font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
}
.status.wait{background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.approw{display:flex;gap:7px;padding:0 11px 11px;flex-wrap:wrap}
.approw .linkbtn.demo{border-style:dashed;color:var(--ink-2)}

.cvfor{
  margin:0 0 14px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2);
  border-left:3px solid var(--hivis);padding-left:9px;
}
.cvhint{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:12px;margin-bottom:18px;
}
.cvhint h4{margin:0 0 8px;font-size:10px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.cvhint p{margin:9px 0 0;font-size:12.5px;color:var(--ink-2)}
.cvf{display:flex;flex-direction:column;gap:5px;margin-bottom:13px;min-width:0}
.cvf > span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.cvf > span em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;opacity:.8}
.cvf input,.cvf textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);resize:vertical;
}
.cvgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 11px}
@media (max-width:420px){ .cvgrid{grid-template-columns:1fr} }
.cvsec{margin:4px 0 9px}
.cvexp{border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:11px;background:var(--surface-2)}
.cvexp .cvf:last-of-type{margin-bottom:9px}
.cvdel{
  background:none;border:0;padding:0;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--pass);
}
.cvadd{margin:0 0 18px}
.cvfile{
  margin:0 0 16px;font-family:var(--font-mono);font-size:12px;
  display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;
}
.cvfile span{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2)}
.cvdoc{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:20px;max-width:62ch;
}
.cvdoc h3{margin:0;font-family:var(--font-display);font-size:23px;font-weight:800;letter-spacing:-.015em}
.cvdoc .cvmeta{margin:4px 0 18px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}
.cvdoc h4{
  margin:18px 0 7px;font-size:10px;font-weight:600;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-2);
}
.cvdoc p{margin:0 0 9px;font-size:14px}
.cvdoc .cvexpline{margin-bottom:12px}
.cvdoc .cvper{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-2)}

/* ---------- vaate lüliti päises (ainult laial ekraanil) ---------- */
.viewtog{display:none}
@media (min-width:900px){
  .viewtog{
    display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;
  }
  .viewtog button{
    background:none;border:0;padding:5px 10px;cursor:pointer;color:var(--ink-2);
    display:grid;place-items:center;
  }
  .viewtog button svg{width:16px;height:16px;display:block}
  .viewtog button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
}

/* ---------- telefonivaade arvutis: seadme raam keset lehte ----------
   .shell saab klassi "web" või "framed". Raamis kehtib telefoni paigutus,
   sest kõik lauaarvuti reeglid allpool nõuavad .shell.web eesliidet. */
.shell.framed{padding:22px}
.shell.framed .app{
  width:390px;max-width:100%;
  height:min(820px,100%);
  border-radius:34px;
  box-shadow:0 0 0 11px var(--ink), 0 30px 64px -30px rgba(0,0,0,.65);
}
@media (max-width:899px){
  .shell.framed{padding:0}
  .shell.framed .app{width:100%;height:100%;border-radius:0;box-shadow:none}
}

/* ---------- lauaarvuti: täisekraan, külgmenüü, kuulutus kõrval ---------- */
@media (min-width:900px){
  .shell.web .app{
    display:grid;
    grid-template-columns:216px 1fr;
    grid-template-rows:auto 1fr;
    grid-template-areas:"top top" "nav main";
  }
  .shell.web .top{grid-area:top;padding:14px 20px}
  .shell.web .brand b{font-size:20px}
  .shell.web .view{grid-area:main;min-height:0}
  .shell.web .nav{
    grid-area:nav;flex-direction:column;align-items:stretch;
    border-top:0;border-right:1px solid var(--line);background:var(--surface-2);
    padding:14px 10px;gap:3px;
  }
  .shell.web .nav button{
    flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:11px;
    padding:11px 14px;border-radius:9px;font-size:14px;
  }
  .shell.web .nav button[aria-current="page"]{background:var(--surface)}
  .shell.web .nav button[aria-current="page"]::after{

function fits(job,p){
  // Kui tegemist on välise kuulutusega (CV Keskus või Töötukassa), lubame seda kaardipakki
  if(!job.isExternal && p.skills && p.skills.length > 0 && p.skills.indexOf(job.skill) === -1) return false;
  for(var i=0;i<p.access.length;i++){ if(job.accom.indexOf(p.access[i]) === -1) return false; }
  var okShift = false;
  if(!p.sched || p.sched.length === 0 || job.isExternal){
    okShift = true;
  } else {
    for(var j=0;j<p.sched.length;j++){ if(job.shifts.indexOf(p.sched[j]) !== -1) okShift = true; }
  }
  if(!okShift) return false;
  if(!job.isExternal && job.pay < p.pay) return false;
  return true;
}
function matching(p){ return JOBS.filter(function(j){ return fits(j,p||S.profile); }); }
function deck(){ return matching().filter(function(j){ return S.seen.indexOf(j.id) === -1; }); }

function num(n,d){
  var s = n.toFixed(d===undefined?2:d);
  return S.lang === "et" ? s.replace(".",",") : s;
}

function getJobHash(id){
  if(typeof id === "number") return id;
  var str = String(id || ""), hash = 0;
  for(var i = 0; i < str.length; i++){
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function photoBG(job, i){
  var numId = getJobHash(job.id);
  var h = (numId * 47 + i * 53) % 360;
  if(job.source === "tootukassa"){
    // Deep Estonia navy blue & royal sapphire/azure gradient for Töötukassa postings
    return "radial-gradient(120% 80% at 75% 15%, hsl("+((h+180)%360)+" 75% 36%), transparent 70%),"
         + "linear-gradient(155deg, hsl("+((h+210)%360)+" 65% 24%), hsl("+((h+230)%360)+" 75% 12%))";
  }
  if(job.isExternal){
    // Beautiful sunset / amber & violet gradient for external CV Keskus postings
    return "radial-gradient(120% 80% at 75% 15%, hsl("+((h+35)%360)+" 55% 36%), transparent 70%),"
         + "linear-gradient(155deg, hsl("+h+" 45% 26%), hsl("+((h+50)%360)+" 52% 14%))";
  }
  return "radial-gradient(120% 80% at 70% 15%, hsl("+((h+30)%360)+" 42% 34%), transparent 70%),"
       + "linear-gradient(155deg, hsl("+h+" 38% 30%), hsl("+((h+45)%360)+" 44% 14%))";
}

function armDrag(el, job){
  var x0 = 0, y0 = 0, dx = 0, dy = 0, dragging = false, pid = null, t0 = 0;
  var like = el.querySelector(".stamp.like"), pass = el.querySelector(".stamp.pass");
  var keep = el.querySelector(".stamp.keep");
  function upward(){ return dy < 0 && Math.abs(dy) > Math.abs(dx) * 1.2; }

  var photo = el.querySelector(".photo"), segs = el.querySelectorAll(".segs span");
  var mark = el.querySelector(".phmark"), shot = 0, downT = null;

  function showPhoto(i){
    shot = (i + 3) % 3;
    photo.style.background = photoBG(job, shot);
    for(var k=0;k<segs.length;k++){ segs[k].className = k === shot ? "on" : ""; }
    mark.textContent = t().photoMark + " " + (shot+1) + "/3";
  }

  var infoBtn = el.querySelector(".infobtn");
  infoBtn.addEventListener("pointerdown", function(e){ e.stopPropagation(); });
  infoBtn.addEventListener("click", function(e){ e.stopPropagation(); openDetail(job); });

  el.addEventListener("pointerdown", function(e){
    if(e.button !== undefined && e.button !== 0) return;
    dragging = true; pid = e.pointerId; t0 = Date.now(); downT = e.target;
    x0 = e.clientX; y0 = e.clientY; dx = 0; dy = 0;
    el.classList.add("drag"); el.classList.remove("anim");
    try{ el.setPointerCapture(pid); }catch(err){}
  });
  el.addEventListener("pointermove", function(e){
    if(!dragging || e.pointerId !== pid) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    var up = upward();
    el.style.transform = "translate("+dx+"px,"+dy+"px) rotate("+(up ? 0 : dx*0.055)+"deg)";
    if(up){
      keep.style.opacity = Math.min(Math.abs(dy)/95, 1);
      like.style.opacity = 0; pass.style.opacity = 0;
    } else {
      var k = Math.min(Math.abs(dx)/95, 1);
      like.style.opacity = dx > 0 ? k : 0;
      pass.style.opacity = dx < 0 ? k : 0;
      keep.style.opacity = 0;
    }
  });
  function end(e){
    if(!dragging || (e.pointerId !== undefined && e.pointerId !== pid)) return;
    dragging = false; el.classList.remove("drag");
    try{ el.releasePointerCapture(pid); }catch(err){}
    if(upward() && dy < -95){ keep.style.opacity = 1; doSave(el, job); return; }
    if(Math.abs(dx) > 95){ fly(el, job, dx > 0); return; }
    el.classList.add("anim");
    el.style.transform = "translate(0,0) rotate(0deg)";
    like.style.opacity = 0; pass.style.opacity = 0; keep.style.opacity = 0;
    /* lühike liikumatu puudutus: fotol = järgmine pilt, info peal = terve kuulutus */
    if(Math.abs(dx) < 7 && Math.abs(dy) < 7 && Date.now() - t0 < 500){
      var onInfo = downT && downT.closest && downT.closest(".scrim, .under");
      if(onInfo){ openDetail(job); return; }
      var r = photo.getBoundingClientRect();
      showPhoto(shot + (e.clientX - r.left < r.width * 0.33 ? -1 : 1));
    }
  }
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
}

function fly(el, job, liked){
  var dir = liked ? 1 : -1;
  el.classList.add("anim");
  el.style.transform = "translate("+(dir*520)+"px,60px) rotate("+(dir*26)+"deg)";
  el.style.opacity = "0";
  el.querySelector(liked ? ".stamp.like" : ".stamp.pass").style.opacity = "1";
  setTimeout(function(){ decide(job, liked); }, 260);
}

function decide(job, liked){
  var L = t(), role = S.lang === "et" ? job.et : job.en;
  if(S.seen.indexOf(job.id) === -1) S.seen.push(job.id);
  S.history.push({id:job.id, act:liked ? "like" : "pass"});
  if(liked){
    if(S.applied.indexOf(job.id) === -1) S.applied.push(job.id);
    $("live").textContent = L.matched(role);
    showMatch(job);
  } else {
    $("live").textContent = L.passed(role);
    if(window.Api) Api.passJob(job.id);
  }
  renderStack(); renderBadge();
}

function topJob(){
  var top = $("stack").querySelector('.card[data-id]:last-child');
  if(!top) return null;
  return {el:top, job:JOBS.filter(function(j){ return String(j.id) === top.dataset.id; })[0]};
}
function swipeTop(liked){
  var t2 = topJob();
  if(t2 && t2.job) fly(t2.el, t2.job, liked);
}
function doSave(el, job){
  if(S.seen.indexOf(job.id) === -1) S.seen.push(job.id);
  if(S.saved.indexOf(job.id) === -1) S.saved.push(job.id);
  S.history.push({id:job.id, act:"save"});
  if(window.Api) Api.saveJob(job.id);
  $("live").textContent = t().saved(S.lang === "et" ? job.et : job.en);
  el.classList.add("anim");
  el.style.transform = "translateY(-560px) scale(.92)";
  el.style.opacity = "0";
  setTimeout(function(){ renderStack(); renderBadge(); }, 260);
}
function saveTop(){
  var t2 = topJob();
  if(t2 && t2.job) doSave(t2.el, t2.job);
}
function undo(){
  var last = S.history.pop();
  if(!last) return;
  var k = S.seen.indexOf(last.id);
  if(k !== -1) S.seen.splice(k,1);
  if(last.act === "like"){
    var m = S.applied.indexOf(last.id);
    if(m !== -1) S.applied.splice(m,1);
    var mm = S.matched.indexOf(last.id);
    if(mm !== -1) S.matched.splice(mm,1);
    delete S.sent[last.id];
    delete S.threads[last.id];
  }
  if(last.act === "save"){
    var s = S.saved.indexOf(last.id);
    if(s !== -1) S.saved.splice(s,1);
  }
  $("live").textContent = t().undone;
  renderStack(); renderBadge();
}

function readCvDraft(){

/* ------------------------------------------------------------------ */
/* Motivatsioonikiri                                                   */
/*                                                                      */
/* Kiri on valikuline ja käib eraldi PDF-ina CV kõrval — kahe faili     */
/* üheks liitmine ei ole brauseris mõistlik ja kandideerimisel käivadki  */
/* need tavaliselt eraldi. Prototüüp hoiab failist ainult nime ja        */
/* suurust; päris üleslaadimine käiks api.js kaudu.                      */
/* ------------------------------------------------------------------ */
var MAX_LETTER = 10 * 1024 * 1024;

function fmtSize(bytes){
  var mb = bytes / (1024*1024);
  if(mb >= 1) return (S.lang === "et" ? mb.toFixed(1).replace(".",",") : mb.toFixed(1)) + " MB";
  var kb = Math.max(1, Math.round(bytes / 1024));
  return kb + " KB";
}

/* Avab seadme failivalija. done(letter|null, viga|null) */
function pickLetter(done){
  var L = t(), inp = $("letterFile");
  inp.value = "";
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f){ done(null, null); return; }
    if(f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)){ done(null, L.letterNotPdf); return; }
    if(f.size > MAX_LETTER){ done(null, L.letterTooBig); return; }
    done({name:f.name, size:f.size, file:f}, null);
  };
  inp.click();
}

/* Kiire tee: pärast „saada praegune" küsitakse kirja kohta */
var pendingLetter = null;

function askLetter(job, cv, tailored, err){
  var L = t(), btns = [];
  if(pendingLetter){
    btns.push({label:L.letterSend, go:function(){
      $("matchpop").hidden = true;
      sendCV(job, cv, tailored, pendingLetter);
    }});
    btns.push({label:L.letterReplace, ghost:true, go:function(){
      pickLetter(function(l, e){ if(l) pendingLetter = l; askLetter(job, cv, tailored, e); });
    }});
    btns.push({label:L.letterRemove, ghost:true, go:function(){
      pendingLetter = null; askLetter(job, cv, tailored, null);
    }});
  } else {
    btns.push({label:L.letterAdd, go:function(){
      pickLetter(function(l, e){ if(l) pendingLetter = l; askLetter(job, cv, tailored, e); });
    }});
    btns.push({label:L.letterSkip, ghost:true, go:function(){
      $("matchpop").hidden = true;
      sendCV(job, cv, tailored, null);
    }});
  }
  popup(
    L.letterBig,
    err || (pendingLetter ? L.letterChosen : L.letterTxt),
    pendingLetter ? pendingLetter.name + " · " + fmtSize(pendingLetter.size) : job.co,
    btns
  );
}

function cloneCV(){
  var src = S.cv[S.lang];
  return {
    name:S.cv.name, phone:S.cv.phone, email:S.cv.email, city:S.cv.city,
    summary:src.summary, availability:src.availability, conditions:src.conditions,
    skills:src.skills.slice(),
    exp:src.exp.map(function(e){ return {role:e.role, org:e.org, period:e.period, text:e.text}; })
  };
}

function slug(s){
  var from = "äöüõšžÄÖÜÕŠŽ", to = "aouoszAOUOSZ", out = "";
  for(var i=0;i<s.length;i++){
    var k = from.indexOf(s[i]);
    out += k === -1 ? s[i] : to[k];
  }
  return out.replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
}

function sendCV(job, cv, tailored, letter){
  var L = t();
  popup(L.sendingBig, L.sendingTxt, job.co, []);
  var file = "CV_" + slug(cv.name) + "_" + slug(S.lang === "et" ? job.et : job.en) + ".pdf";
  /* Kiri läheb eraldi failina CV kõrval. Päris üleslaadimine kuulub api.js alla. */
  var shown = letter ? file + "  +  " + letter.name : file;
  if(window.Api) Api.applyJob(job.id, tailored, cv);
  setTimeout(function(){
    S.sent[job.id] = {
      at:nowHM(), tailored:tailored, cv:cv, file:file,
      letter: letter ? {name:letter.name, size:letter.size} : null
    };
    pendingLetter = null;
    renderBadge();
    popup(L.sentBig, L.sentTxt, shown, [
      {label:L.sentMore, go:function(){ $("matchpop").hidden = true; $("stack").focus(); }}
    ]);
  }, 1100);
}

    li.className = "appcard";

      + '<span class="prev">'+L.sentAt(rec.at || "", subText)+'</span></span>'
      + '<span class="status wait">'+(job.isExternal ? portalName : L.statusWait)+'</span></div>';
    var row = document.createElement("div");
    row.className = "approw";
    if (job.isExternal) {
      var extBtn = document.createElement("button");

      row.appendChild(extBtn);
    } else {
      var view = document.createElement("button");

      view.onclick = function(){ openCvView(id); };
      var sim = document.createElement("button");

      sim.onclick = function(){ employerMatch(id); };

  /* 2. Avatud vestlused — alles pärast tööandja vastust */

  $("cTitle").hidden = false;
  $("cTitle").textContent = L.chatTitle;

    var none = document.createElement("li");
    none.className = "emptyrow";
    none.textContent = L.chatEmpty;
    list.appendChild(none);
  }
  S.matched.slice().reverse().forEach(function(id){
    var job = JOBS.filter(function(j){ return j.id === id; })[0];
    var msgs = S.threads[id] || [];

    b.type = "button"; b.className = "mrow";
    b.innerHTML = '<span class="logo" aria-hidden="true">'+job.ini+'</span>'
      + '<span class="who"><span class="co">'+job.co+'</span>'
      + '<span class="prev">'+(last ? escapeHTML(S.lang==="et" ? (last.et||last.text) : (last.en||last.text)) : "")+'</span></span>'
      + (last && last.who === "them" ? '<span class="dot" aria-hidden="true"></span>' : '');
    b.onclick = function(){ openChat(id); };
    li.appendChild(b); list.appendChild(li);
  });

  sl.innerHTML = "";
  $("sTitle").textContent = L.savedTitle;

    var job = JOBS.filter(function(j){ return j.id === id; })[0];
    var li = document.createElement("li");
    var b = document.createElement("button");
    b.type = "button"; b.className = "mrow";
    b.innerHTML = '<span class="logo" aria-hidden="true">'+job.ini+'</span>'
      + '<span class="who"><span class="co">'+(S.lang==="et"?job.et:job.en)+'</span>'
      + '<span class="prev">'+job.co+' · '+num(job.pay)+' €/h</span></span>';
    b.onclick = function(){ openDetail(job); };
    li.appendChild(b); sl.appendChild(li);
  });
}

/* Kuni tööandja vaadet pole, saab tema vastust demo jaoks siit käivitada.
   Päris versioonis tuleb see tööandja enda swipe'ist. */
function employerMatch(id){
  if(S.matched.indexOf(id) === -1) S.matched.push(id);
  var job = JOBS.filter(function(j){ return j.id === id; })[0];
  if(!S.threads[id]){
    S.threads[id] = [{who:"them", et:job.firstEt, en:job.firstEn, time:nowHM()}];
  }
  if(window.Api) Api.simulateMatch(id);
  renderMatches(); renderBadge();
  openChat(id);
}

function openChat(id){
  S.thread = id;
  var job = JOBS.filter(function(j){ return j.id === id; })[0];
  $("chatTitle").textContent = job ? job.co : "Vestlus";
  renderMsgs();
  renderQuick();
  $("chat").hidden = false;
  $("msgInput").focus();
  loadChatMessages(id);
}

async function loadChatMessages(id){
  if(!window.Api) return;
  try {
    var conv = await Api.getConversation(id);
    if(conv && Array.isArray(conv.messages) && conv.messages.length > 0){
      S.threads[id] = conv.messages.map(function(m){
        return {
          who: m.isMe ? "me" : "them",
          text: m.content,
          time: m.sentAt ? new Date(m.sentAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : nowHM()
        };
      });
      if(S.thread === id) renderMsgs();
    }
  } catch(e) {
    console.warn("Could not fetch messages for chat:", e);
  }
}
function msgText(m){ return m.text !== undefined ? m.text : (S.lang === "et" ? m.et : m.en); }
function renderMsgs(){
  var box = $("msgs");
  box.innerHTML = '<span class="sysmsg">'+t().sys+'</span>';
  (S.threads[S.thread] || []).forEach(function(m){
    var d = document.createElement("div");
    d.className = "msg " + (m.who === "me" ? "me" : "them");
    d.innerHTML = escapeHTML(msgText(m)) + '<span class="time">'+m.time+'</span>';
    box.appendChild(d);
  });
  box.scrollTop = box.scrollHeight;
}
function renderQuick(){
  var q = $("quick");
  q.innerHTML = "";
  t().quick.forEach(function(text){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = text;
    b.onclick = function(){ send(text); };
    q.appendChild(b);
  });
}
function escapeHTML(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function send(text){
  if(!text.trim() || S.thread === null) return;
  var id = S.thread;
  S.threads[id].push({who:"me", text:text, time:nowHM()});
  renderMsgs();
  if(window.Api) Api.sendMessage(id, text);
  var pool = t().reply;
  var pick = pool[S.threads[id].length % pool.length];
  setTimeout(function(){
    if(S.thread === null) return;
    S.threads[id].push({who:"them", text:pick, time:nowHM()});
    renderMsgs(); renderMatches();
  }, 1100);
}

var STEPS = [
  {key:"skills", g:"skills"},
  {key:"access", g:"access"},
  {key:"sched",  g:"sched", pay:true}
];
function openSetup(){
  S.draft = {
    skills:S.profile.skills.slice(), access:S.profile.access.slice(),
    sched:S.profile.sched.slice(), pay:S.profile.pay
  };
  S.step = 0;
  $("setup").hidden = false;
  renderStep();
}
function renderStep(){
  var L = t(), st = STEPS[S.step];
  $("setupTitle").textContent = L.setupTitle;
  var dots = $("setup").querySelectorAll(".steps span");
  for(var i=0;i<dots.length;i++){ dots[i].className = i <= S.step ? "on" : ""; }
  $("stepH").textContent = L["step"+(S.step+1)+"H"];
  $("stepP").textContent = L["step"+(S.step+1)+"P"];
  $("stepBack").textContent = L.back;
  $("stepBack").disabled = S.step === 0;
  $("stepNext").textContent = S.step === STEPS.length-1 ? L.done : L.next;

  var body = $("stepBody");
  body.innerHTML = "";
  var grid = document.createElement("div");
  grid.className = "taggrid";
  Object.keys(TAGS).forEach(function(id){
    if(TAGS[id].g !== st.g) return;
    var b = document.createElement("button");
    b.type = "button"; b.className = "tag"; b.textContent = tag(id);
    var on = S.draft[st.key].indexOf(id) !== -1;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.onclick = function(){
      var arr = S.draft[st.key], k = arr.indexOf(id);
      if(k === -1) arr.push(id); else arr.splice(k,1);
      b.setAttribute("aria-pressed", k === -1 ? "true" : "false");
      liveCount();
    };
    grid.appendChild(b);
  });
  body.appendChild(grid);

  if(st.pay){
    var wrap = document.createElement("div");
    wrap.style.marginTop = "20px";
    wrap.innerHTML = '<h3 class="glabel" style="margin:0 0 6px">'+L.minPay+'</h3>'
      + '<div class="payrow"><span class="v" id="payV">'+num(S.draft.pay)+'</span><span class="u">€/h</span></div>';
    var r = document.createElement("input");
    r.type = "range"; r.min = "5"; r.max = "12"; r.step = "0.1";
    r.value = String(S.draft.pay); r.id = "payRange";
    r.setAttribute("aria-label", L.minPay);
    r.oninput = function(){
      S.draft.pay = parseFloat(r.value);
      $("payV").textContent = num(S.draft.pay);
      liveCount();
    };
    wrap.appendChild(r);
    body.appendChild(wrap);
  }
  liveCount();
}
function liveCount(){
  $("liveCount").innerHTML = t().live(matching(S.draft).length);
}

function mapBackendJob(bj){
  var id = bj.id;
  DETAILS[id] = {
    et: {
      desc: [bj.description],
      hours: bj.workingHours || "",
      place: bj.location || "",
      start: bj.startDateText || "",
      offers: bj.offers || []
    },
    en: {
      desc: [bj.description],
      hours: bj.workingHours || "",
      place: bj.location || "",
      start: bj.startDateText || "",
      offers: bj.offers || []
    }
  };
  return {
    id: id,
    co: bj.companyName,
    ini: bj.companyInitials || (bj.companyName ? bj.companyName.substring(0,2).toUpperCase() : "JO"),
    pay: Number(bj.hourlyPay),
    km: Number(bj.distanceKm) || 2.0,
    days: 1,
    skill: bj.primarySkill,
    et: bj.title,
    en: bj.title,
    isExternal: bj.isExternal !== undefined ? !!bj.isExternal : (typeof bj.id === "string" && !bj.employerProfileId),
    source: bj.source || (bj.isExternal ? "cvkeskus" : "internal"),
    externalUrl: bj.externalUrl || (bj.source === "tootukassa" ? "https://www.tootukassa.ee/et/toopakkumised" : (bj.isExternal ? "https://www.cvkeskus.ee" : null)),
    shifts: bj.shifts || [],
    accom: bj.accommodations || [],
    reqEt: bj.requirements || [],
    reqEn: bj.requirements || [],
    firstEt: bj.firstMessage || "Tere! Nägin su profiili.",
    firstEn: bj.firstMessage || "Hi! Saw your profile."
  };
}

async function syncInteractionsFromDb(){
  if(!window.Api) return;
  try {
    var results = await Promise.all([
      Api.getApplied(),
      Api.getSaved(),
      Api.getConversations()
    ]);
    var appliedData = results[0] || [];
    var savedData = results[1] || [];
    var convs = results[2] || [];

    // 1. Process Saved Jobs
    if(Array.isArray(savedData)){
      savedData.forEach(function(item){
        var j = item.job;
        if(!j) return;
        var jId = j.id;
        if(S.saved.indexOf(jId) === -1) S.saved.push(jId);
        if(S.seen.indexOf(jId) === -1) S.seen.push(jId);

        // Tagame, et kuulutus on JOBS nimekirjas olemas
        if(!JOBS.some(function(existing){ return existing.id === jId; })){
          JOBS.push(mapBackendJob(j));
        }
      });
    }

    // 2. Process Applied Jobs
    if(Array.isArray(appliedData)){
      appliedData.forEach(function(app){
        var j = app.job;
        if(!j) return;
        var jId = j.id;
        if(S.applied.indexOf(jId) === -1) S.applied.push(jId);
        if(S.seen.indexOf(jId) === -1) S.seen.push(jId);

        if(!S.sent[jId]){
          var dateStr = app.appliedAt ? new Date(app.appliedAt).toLocaleDateString() : nowHM();
          S.sent[jId] = {
            at: dateStr,
            tailored: !!app.isTailoredCv,
            cv: S.cv,
            file: "CV_" + slug((S.cv && S.cv.name) || "Candidate") + ".pdf"
          };
        }

        // Tööandja vastus / match
        if(app.status === "Accepted" || app.hasConversation){
          if(S.matched.indexOf(jId) === -1) S.matched.push(jId);
        }

        if(!JOBS.some(function(existing){ return existing.id === jId; })){
          JOBS.push(mapBackendJob(j));
        }
      });
    }

    // 3. Process Conversations & Messages
    if(Array.isArray(convs)){
      convs.forEach(function(c){
        var j = c.job;
        if(!j) return;
        var jId = j.id;
        if(S.matched.indexOf(jId) === -1) S.matched.push(jId);

        if(!S.threads[jId] || S.threads[jId].length === 0){
          if(c.lastMessage){
            S.threads[jId] = [{
              who: c.lastMessage.senderRole === "Employer" ? "them" : "me",
              text: c.lastMessage.content,
              time: c.lastMessage.sentAt ? new Date(c.lastMessage.sentAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : nowHM()
            }];
          } else if(j.firstMessage) {
            S.threads[jId] = [{
              who: "them",
              et: j.firstMessage,
              en: j.firstMessage,
              time: nowHM()
            }];
          }
        }
      });
    }

    renderBadge();
    renderStack();
    if(S.tab === "matches") renderMatches();
  } catch(err) {
    console.warn("Error syncing interactions from DB:", err);
  }
}

async function initBackendSession(name){
  if(!window.Api) return;
  try {
    Api.setCandidate(name);

    // 1. Kontrolli või laadi kandidaadi profiil andmebaasist
    var dbProfile = await Api.getProfile();
    if(dbProfile){
      if(dbProfile.fullName) S.cv.name = dbProfile.fullName;
      if(dbProfile.minHourlyPay) S.profile.pay = dbProfile.minHourlyPay;
      if(Array.isArray(dbProfile.skills) && dbProfile.skills.length > 0) S.profile.skills = dbProfile.skills;
      if(Array.isArray(dbProfile.accommodations) && dbProfile.accommodations.length > 0) S.profile.access = dbProfile.accommodations;
      if(Array.isArray(dbProfile.schedules) && dbProfile.schedules.length > 0) S.profile.sched = dbProfile.schedules;
      if(dbProfile.city) S.cv.city = dbProfile.city;
      if(dbProfile.phone) S.cv.phone = dbProfile.phone;
      if(dbProfile.summary){
        if(S.cv.et) S.cv.et.summary = dbProfile.summary;
        if(S.cv.en) S.cv.en.summary = dbProfile.summary;
      }
      if(Array.isArray(dbProfile.experiences) && dbProfile.experiences.length > 0){
        var mappedExp = dbProfile.experiences.map(function(e){
          return { role: e.roleTitle, org: e.organization, period: e.period, text: e.description };
        });
        if(S.cv.et) S.cv.et.exp = mappedExp;
        if(S.cv.en) S.cv.en.exp = mappedExp;
      }
    } else {
      await Api.updateProfile({
        fullName: name,
        minHourlyPay: S.profile.pay,
        skills: S.profile.skills,
        accommodations: S.profile.access,
        schedules: S.profile.sched,
        summary: S.cv && S.cv.et ? S.cv.et.summary : "",
        availability: S.cv && S.cv.et ? S.cv.et.availability : "",
        conditions: S.cv && S.cv.et ? S.cv.et.conditions : "",
        experiences: S.cv && S.cv.et ? (S.cv.et.exp || []).map(function(e){
          return { roleTitle: e.role, organization: e.org, period: e.period, description: e.text };
        }) : []
      });
    }

    var bJobs = await Api.getAllJobs();
    if(bJobs && bJobs.length > 0){
      JOBS = bJobs.map(mapBackendJob);
    }

    // Laadi selle kandidaadi salvestatud ja kandideeritud tööd andmebaasist
    await syncInteractionsFromDb();

    renderStack();
    renderBadge();
    renderProfile();
    if(deskVisible()) syncDesk();
  } catch(err) {
    console.warn("Backend session sync error:", err);
  }
}

    S.seen = saved.seen || [];
    S.applied = saved.applied || [];
    S.sent = saved.sent || {};

    S.saved = saved.saved || [];
    S.history = saved.history || [];

  var hash = (location.hash || "").replace("#", "").toLowerCase();

  else if(hash === "arvuti" || hash === "desktop") setView("web", false);

    pop.hidden = false;
    var inp = $("nameInput");
    if(inp){
      inp.value = "";
      setTimeout(function(){ inp.focus(); }, 100);

  }

  var form = $("nameForm");
  if(form){
    form.onsubmit = function(e){
      e.preventDefault();
      var val = ($("nameInput").value || "").trim();
      if(!val) return;
      if(S.cv) S.cv.name = val;
      if(window.Api) Api.setCandidate(val);
      $("namepop").hidden = true;
      initBackendSession(val);
    };
  }
}
